# 功能建议表单：先问清楚想解决的场景，再问期望的做法，避免只丢一句“加个 XX”。
name: 功能建议
description: 希望 MaiDroid 增加或改进某个功能
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！先确认一下归属：

        - 涉及 **MaiBot 本体**的新功能（回复逻辑、记忆、插件机制等），请到 [MaiBot 仓库](https://github.com/Mai-with-u/MaiBot/issues)。
        - 想让 MaiDroid **接入新的消息平台**，请在下面选“消息平台接入”，并写清楚平台对应的 MaiBot 适配器（有现成的适配器仓库最好附上链接）。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我搜索过现有的 Issues（包括已关闭的）和 README 里“仍待完善”一节，没有找到相同的建议
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的方面
      options:
        - 首次引导
        - 容器与运行环境
        - MaiBot 管理（启动、更新、文件）
        - WebUI 页签
        - 消息平台接入
        - 容器 SSH
        - 应用更新
        - 界面与交互
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到了什么不方便，或者在什么场景下需要这个功能？先说场景，再说方案。
      placeholder: 例如：我把旧手机放在家里一直充电，想在外面也能看到麦麦是不是还活着……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 你希望它怎么工作？有界面草图、参考的其他应用截图都可以直接拖进来。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法
      description: 现在是怎么绕过去的？还想到过哪些做法？

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与方式
      options:
        - label: 我愿意帮忙测试
        - label: 我愿意自己动手实现并提交 PR
