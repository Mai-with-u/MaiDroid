name = "maidroid-ops"
main = "src/index.ts"
compatibility_date = "2025-02-01"

# 首次部署步骤：
# 1. 创建 D1 数据库：npx wrangler d1 create maidroid-ops，将输出的 database_id 填入下方
# 2. 初始化表结构：npx wrangler d1 execute maidroid-ops --remote --file=./schema.sql
# 3. 生成签名密钥：npm run keygen（将输出的私钥存入 secret，公钥填入 Android 端 ManifestSignatureVerifier.kt）
# 4. 配置密钥（均不入库）：
#    npx wrangler secret put ADMIN_TOKEN
#    npx wrangler secret put SIGNING_PRIVATE_KEY
#    npx wrangler secret put IP_HASH_SALT
# 5. 部署上线：npm run deploy，并在 Cloudflare 控制台为该 Worker 绑定自定义域名

[vars]
SIGNING_KEY_ID = "2026-k1"

[[d1_databases]]
binding = "DB"
database_name = "maidroid-ops"
database_id = "00000000-0000-0000-0000-000000000000"
