  - name: QQ 官方机器人适配器的问题（MaiBot-QQ-Adapter）
    url: https://github.com/Mai-with-u/MaiBot-QQ-Adapter/issues
    about: 通过 QQ 开放平台接入官方机器人时，适配器本身的问题
  - name: NapCatQQ 本体的问题
    url: https://github.com/NapNeko/NapCatQQ/issues
